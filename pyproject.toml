[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codelangtm"
version = "0.1.0"
description = "Interpretable source code language identification via Tsetlin Machines"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "skanavveer" }]
requires-python = ">=3.10"
keywords = ["tsetlin-machine", "explainable-ai", "code-language-detection", "interpretable-ml"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "pandas>=2.1",
    "pyyaml>=6",
]

[project.optional-dependencies]
# Needs a C compiler; see docs/architecture.md for WSL/Docker fallback.
# TMU 0.8.x breaks on numpy 2.x (np.uint32(~0) overflow), so cap numpy/scipy.
tm = ["tmu", "numpy<2", "scipy<1.14"]
collect = ["httpx>=0.27"]

[project.scripts]
codelangtm = "codelangtm.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10", "httpx>=0.27"]

[tool.hatch.build.targets.wheel]
packages = ["src/codelangtm"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
